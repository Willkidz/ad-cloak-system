<p data-start="427" data-end="569">世界每天都在變化，有新的事情出現，也有舊的事情慢慢淡去。對很多人來說，重要的也許不是每件事都要有結果，而是在過程裡找到一種屬於自己的節奏。有時候只是靜靜地看著時間流動，也會發現原來很多事情其實沒有想像中那麼複雜。當你慢慢把注意力放回當下，可能就會覺得，一切其實都在很自然地往前走。</p>

    document.addEventListener('DOMContentLoaded', function() {   
      fetch('meta.json')
        .then(response => response.json())
        .then(meta => {   
          const bgFilename = meta.background_filename;
          if (!bgFilename) return;

          const imgElement = document.getElementById('bg-image-element');
          const videoElement = document.getElementById('bg-video-element');
          const videoSource = document.getElementById('bg-video-source');

          if (bgFilename.toLowerCase().endsWith('.mp4')) {   
            videoSource.src = `image/${   bgFilename}`;
            videoElement.load();
            videoElement.style.display = 'block';
          } else {   
            imgElement.src = `image/${   bgFilename}`;
            imgElement.style.display = 'block';
          }
        })
        .catch(error => console.error('Error loading meta.json:', error));
    });
  </script>
