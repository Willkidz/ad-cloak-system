# Don AI 受控標籤詞彙表 (Controlled Vocabulary) v2.0
# 所有 Markdown 文件的 YAML frontmatter 中的 tags 必須從此表選擇
# 規則：全小寫英文 kebab-case，每個文件 2-6 個標籤
# 維護日期：2026-03-29

# ============================================================
# 文件類型 (type 欄位，單選)
# ============================================================
type:
  - project-doc    # 專案相關文件（位於 03-專案）
  - concept        # 概念解釋、理論知識（位於 04-資源與參考）
  - snippet        # 可重用的代碼片段（位於 04-資源與參考）
  - sop            # 標準操作流程（位於 06-SOP流程）
  - log            # 日誌、會議記錄、動態記憶（位於 02-動態記憶）
  - rule           # 系統規則、原則（位於 01-核心原則）
  - search-result  # 搜索結果整理（位於 04-資源與參考）

# ============================================================
# 狀態標籤 (status 欄位，單選)
# ============================================================
status:
  - active         # 使用中
  - draft          # 草稿
  - archived       # 已歸檔
  - urgent         # 緊急
  - blocked        # 被阻擋
  - needs-review   # 需要審查

# ============================================================
# 技術棧 (tech-stack) — 13 個
# ============================================================
tech-stack:
  - cloudflare           # Cloudflare 平台總稱
  - cloudflare-workers   # Cloudflare Workers 邊緣計算
  - cloudflare-pages     # Cloudflare Pages 靜態託管
  - cloudflare-d1        # Cloudflare D1 資料庫
  - cloudflare-kv        # Cloudflare KV 鍵值存儲
  - n8n                  # N8N 自動化平台
  - react                # React 前端框架
  - typescript           # TypeScript 語言
  - javascript           # JavaScript 語言
  - hono                 # Hono Web 框架
  - tailwindcss          # TailwindCSS 樣式框架
  - vite                 # Vite 建構工具
  - python               # Python 語言

# ============================================================
# 平台與服務 (platform) — 7 個
# ============================================================
platform:
  - facebook             # Facebook / Meta 平台
  - meta-ads             # Meta 廣告系統（含 Ads Manager）
  - google-sheets        # Google Sheets
  - line                 # LINE 平台（含 OA、Bot、LIFF）
  - telegram             # Telegram 平台
  - github               # GitHub 平台
  - github-actions       # GitHub Actions CI/CD

# ============================================================
# 專案 (project) — 8 個
# ============================================================
project:
  - godview              # 上帝視角歸因系統
  - cloak-admin          # 斗篷管理後台
  - shadow-cloak         # 隱者斗篷反向代理
  - known                # 廣為人知專案
  - firebird             # 火鳥專案
  - line-redirect        # LINE 重定向 Worker
  - money-page           # Money Page
  - safe-page            # 安全頁
  - douyin-knowledge     # 抖影知識系統

# ============================================================
# 功能領域 (domain) — 15 個
# ============================================================
domain:
  - frontend             # 前端開發
  - backend              # 後端開發
  - api                  # API 開發與整合
  - database             # 資料庫相關（非特指 D1 時使用）
  - dns                  # DNS 設定與域名管理
  - deployment           # 部署與發佈
  - ci-cd                # 持續整合 / 持續部署
  - security             # 安全性
  - monitoring           # 監控與告警
  - testing              # 測試
  - automation           # 自動化
  - ui-ux                # UI/UX 設計
  - architecture         # 系統架構
  - infrastructure       # 基礎設施
  - serverless           # 無伺服器架構

# ============================================================
# 廣告與行銷 (advertising) — 10 個
# ============================================================
advertising:
  - advertising          # 廣告總稱
  - cloaking             # 斗篷技術
  - pixel                # 像素追蹤（ADS / BC 像素）
  - capi                 # Conversions API（伺服器端事件）
  - attribution          # 歸因分析
  - ad-creative          # 廣告素材與創意
  - landing-page         # 著陸頁 / 素材中心
  - conversion           # 轉換優化
  - audience-targeting   # 受眾定向
  - ad-compliance        # 廣告合規

# ============================================================
# 業務領域 (business) — 6 個
# ============================================================
business:
  - smm-panel            # SMM Panel 業務
  - gambling             # 博弈相關
  - pricing              # 定價分析
  - market-research      # 市場研究
  - competitor-analysis  # 競品分析
  - supplier-analysis    # 供應商分析

# ============================================================
# 文件性質 (doc-type) — 14 個
# ============================================================
doc-type:
  - sop                  # 標準操作流程
  - checklist            # 檢查清單
  - troubleshooting      # 問題排除 / Debug
  - configuration        # 配置設定
  - reference            # 參考資料
  - analysis             # 分析報告
  - guidelines           # 指南規範
  - index                # 索引文件
  - memory               # AI 記憶文件
  - changelog            # 變更記錄
  - todo                 # 待辦事項
  - roadmap              # 路線圖
  - incident             # 事件報告
  - skills               # 技能模組

# ============================================================
# AI 與工具 (ai-tools) — 5 個
# ============================================================
ai-tools:
  - ai-agent             # AI Agent
  - manus                # Manus AI
  - cursor               # Cursor IDE
  - prompt-engineering   # 提示詞工程
  - rag                  # RAG 檢索增強生成

# ============================================================
# 工作流程 (workflow) — 11 個
# ============================================================
workflow:
  - workflow             # 工作流程
  - webhook              # Webhook
  - data-collection      # 數據收集
  - reporting            # 報告
  - credentials          # 認證資訊
  - token-saving         # Token 節省
  - version-control      # 版本控制
  - documentation        # 文檔管理
  - knowledge-base       # 知識庫
  - collaboration        # 協作
  - planning             # 規劃

