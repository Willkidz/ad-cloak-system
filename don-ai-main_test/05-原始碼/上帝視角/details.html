<p data-start="427" data-end="569">世界每天都在變化，有新的事情出現，也有舊的事情慢慢淡去。對很多人來說，重要的也許不是每件事都要有結果，而是在過程裡找到一種屬於自己的節奏。有時候只是靜靜地看著時間流動，也會發現原來很多事情其實沒有想像中那麼複雜。當你慢慢把注意力放回當下，可能就會覺得，一切其實都在很自然地往前走。</p>
<p>&nbsp;</p>
<p data-start="571" data-end="706" data-is-last-node="" data-is-only-node="">所以偶爾寫一點沒有特別意義的文字，好像也沒什麼不好。它不一定需要被解釋，也不一定需要被理解，只是單純地存在著，就像日常生活裡的一個小片段。當你讀到這裡時，也許會發現，其實這些話看起來像是在說什麼，但好像又沒有真的在說什麼。不過也正是因為這樣，它才變成了一段很單純的廢話。</p>
